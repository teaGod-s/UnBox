<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- UnBox isometric box logo: three faces in three soft colors, smiley on the top face. -->
  <!-- Top face (soft cream) -->
  <polygon points="512,72 893,292 512,512 131,292" fill="#F7E7B4"/>
  <!-- Right face (soft mint) -->
  <polygon points="893,292 893,732 512,952 512,512" fill="#A8D8C5"/>
  <!-- Left face (soft sky blue) -->
  <polygon points="131,292 512,512 512,952 131,732" fill="#A9C9E8"/>
  <!-- Smiley painted on the top face, mapped through the isometric transform. -->
  <g transform="matrix(762 0 381 -220 131 292)">
    <circle cx="0.35" cy="0.40" r="0.095" fill="#4A4338"/>
    <circle cx="0.65" cy="0.40" r="0.095" fill="#4A4338"/>
    <path d="M 0.36 0.62 Q 0.5 0.76 0.64 0.62" fill="none" stroke="#4A4338" stroke-width="0.055" stroke-linecap="round"/>
  </g>
</svg>
