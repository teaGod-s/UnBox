# UnBox 分平台原生出包。
#
# Wails v3 桌面应用依赖平台原生工具链（Linux 的 GTK/WebKit、macOS 的
# WKWebView、Windows 的 WebView2 + syso），无法可靠交叉编译，所以放弃
# goreleaser，改用「每个平台各自的 runner 原生编译 + 打包」。
#
# 触发方式：
#   - 推送 v* 标签（如 v0.1.0）→ 构建并自动创建 GitHub Release 挂载产物
#   - 手动 workflow_dispatch → 仅构建并上传产物（不建 Release）
#
# 产物：
#   - Linux   UnBox-<ver>-linux-amd64.deb / .AppImage
#   - Windows UnBox-<ver>-windows-amd64-installer.exe / -amd64.exe
#   - macOS   UnBox-<ver>-macos-<arch>.zip（内含 .app）

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          - os: windows-latest
            name: windows-amd64
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9

      - name: Build
        run: wails3 build

      - name: Package Linux (deb + AppImage)
        if: runner.os == 'Linux'
        run: |
          wails3 task linux:create:deb
          wails3 task linux:create:appimage
          V="${GITHUB_REF_NAME#v}"
          mv bin/*.deb "UnBox-${V}-linux-amd64.deb"
          mv bin/*.AppImage "UnBox-${V}-linux-amd64.AppImage"
          ls -la

      - name: Package Windows (NSIS installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          wails3 task windows:package
          V="${GITHUB_REF_NAME#v}"
          mv bin/*-installer.exe "UnBox-${V}-windows-amd64-installer.exe"
          mv bin/unbox.exe "UnBox-${V}-windows-amd64.exe"
          ls -la

      - name: Package macOS (.app → zip)
        if: runner.os == 'macOS'
        run: |
          wails3 task darwin:package
          V="${GITHUB_REF_NAME#v}"
          ARCH="$(uname -m)"
          (cd bin && zip -qr "../UnBox-${V}-macos-${ARCH}.zip" unbox.app)
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: UnBox-*
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
