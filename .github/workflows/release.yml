# UnBox 分平台出包，每平台覆盖 amd64 + arm64（macOS 为 universal）。
#
# Wails v3 桌面应用依赖平台原生工具链（Linux 的 GTK/WebKit、macOS 的
# WKWebView、Windows 的 WebView2 + syso），所以放弃 goreleaser，改用
# 「每个平台各自的 runner 原生编译 amd64，arm64 在同 runner 上交叉编译」：
# Windows 走纯 Go（CGO=0）交叉编译 GOARCH=arm64；Linux arm64 在 amd64 宿主上用
# 按 --platform linux/arm64 构建的 wails-cross 镜像（binfmt 模拟 + 容器内 arm64
# 原生 gcc 直接 go build）；macOS 用 lipo 合成 arm64+amd64 通用二进制。
#
# 触发方式：
#   - 推送 v* 标签（如 v0.1.0）→ 构建并自动创建 GitHub Release 挂载产物
#   - 手动 workflow_dispatch → 仅构建并上传产物（不建 Release）
#
# 产物：
#   - Linux   UnBox-<ver>-linux-amd64.deb / .AppImage
#             UnBox-<ver>-linux-arm64.deb
#   - Windows UnBox-<ver>-windows-amd64/arm64-installer.exe / -amd64.exe / -arm64.exe
#   - macOS   UnBox-<ver>-macos-universal.zip（内含 .app，arm64 + amd64 通用二进制）

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
            arch: amd64
          - os: ubuntu-24.04
            name: linux-arm64
            arch: arm64
          - os: windows-latest
            name: windows-amd64
            arch: amd64
          - os: windows-latest
            name: windows-arm64
            arch: arm64
          - os: macos-latest
            name: macos-universal
            # 不设 arch：universal 内部按 task var 各编 amd64/arm64 再 lipo
    runs-on: ${{ matrix.os }}
    # ARCH 驱动 stock Taskfile 里所有 {{.ARCH}}（syso 架构、NSIS ARG_FLAG、
    # 单 arch build 的 GOARCH）；universal 路径里 build:universal 用显式
    # task var（ARCH=amd64/arm64）覆盖 env，故 macOS 此处 ARCH 为空也无碍。
    #
    # GOARCH 绝不在 job 级设置——两个坑都因它而起：
    #   1) arm64 任务里 `go install wails3` 会交叉编译，二进制落进
    #      $GOPATH/bin/<GOOS>_<GOARCH>/ 子目录，而 setup-go 只把 $GOPATH/bin
    #      加进 PATH → wails3: command not found。
    #   2) macOS universal：matrix.arch 为空 → job 级 GOARCH=""（空串但已
    #      设置）。go-task 里 shell env 优先级高于 Task env:，build:native
    #      的 `env: GOARCH: '{{.ARCH | default ARCH}}'`（应解为 amd64/arm64）
    #      被空串覆盖，两次 go build 都退回宿主架构（macos-latest=arm64）
    #      → lipo 报 "same architectures (arm64)"。去掉 job 级 GOARCH 后
    #      Task env 才生效，两架构才分得开。
    # Linux generate:deb 仍需 shell GOARCH 供 nfpm.yaml `arch: ${GOARCH}` 读取，
    # 故在各 Linux 打包步骤内 export GOARCH="${ARCH}"（此时 wails3 已装好，
    # 不会触发坑 1；值与 Task env 一致，不触发坑 2）。
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9

      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.1" >> "$GITHUB_ENV"
          fi

      # Linux arm64 在 amd64 runner 上编译：先注册 QEMU binfmt，再用 --platform
      # linux/arm64 构建 wails-cross——这样镜像里 apt 装的 gcc 本身就是 arm64，
      # 容器内可 CGO_ENABLED=1 GOARCH=arm64 原生编译。stock setup:docker 不传
      # --platform，装出 amd64 镜像，容器内 gcc 与目标架构不符。
      - name: Setup Docker cross-compile image (arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker build --platform linux/arm64 -t wails-cross \
            -f build/docker/Dockerfile.cross build/docker/

      - name: Package Linux (deb + AppImage)
        if: runner.os == 'Linux' && matrix.arch == 'amd64'
        run: |
          export GOARCH="${ARCH}"   # nfpm.yaml `arch: ${GOARCH}` 读宿主 env
          wails3 task linux:create:deb
          wails3 task linux:create:appimage
          V="${GITHUB_REF_NAME#v}"
          mv bin/*.deb       "UnBox-${V}-linux-amd64.deb"
          mv bin/*.AppImage  "UnBox-${V}-linux-amd64.AppImage"
          ls -la

      # 故意不用 linux:create:deb：其 deps: build 走 build:docker → build.sh，
      # 而 build.sh 构建的是仓库根目录 `.` —— 根目录是库包 assets（cmd/unbox
      # 才是 main），`go build -o X .` 退出码 0 却只写一个几十 KB 的 ar 归档，
      # 上一版 deb 因此只有 355KB 且装的是废包；build.sh 的 LDFLAGS 也没带
      # -X appVersion，版本号注入同样缺失。这里绕过 build.sh 直接编 ./cmd/unbox。
      - name: Package Linux arm64 (deb only)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          export GOARCH="${ARCH}"   # nfpm.yaml `arch: ${GOARCH}` 读宿主 env
          # build.sh 被绕过，前端得由宿主产出（容器内只做 go build）
          wails3 task common:build:frontend
          docker run --rm --entrypoint /bin/bash \
            -v "${PWD}:/app" \
            -v "$(go env GOMODCACHE):/go/pkg/mod" \
            -w /app \
            -e GOOS=linux -e GOARCH="${ARCH}" -e CGO_ENABLED=1 \
            -e CC=gcc -e CGO_CFLAGS="-w" \
            -e VERSION="${VERSION}" \
            wails-cross -c 'go build -tags production -trimpath -buildvcs=true -ldflags="-s -w -X github.com/unbox/unbox/internal/shell.appVersion=${VERSION}" -o bin/unbox ./cmd/unbox'
          # 守卫：bin/unbox 应是 20MB+ 的真二进制。万一又编成 ar 归档（几十 KB）
          # 就提前炸掉，别静默装进 deb 发到 Release 上。
          SZ=$(stat -c%s bin/unbox)
          file bin/unbox
          echo "bin/unbox: ${SZ} bytes"
          test "${SZ}" -gt 5000000 || { echo "bin/unbox 过小（${SZ}B），疑似编成 ar 归档"; exit 1; }
          wails3 task linux:generate:dotdesktop
          wails3 task linux:generate:deb
          V="${GITHUB_REF_NAME#v}"
          mv bin/*.deb "UnBox-${V}-linux-arm64.deb"
          dpkg-deb -f "UnBox-${V}-linux-arm64.deb" Package Version Architecture
          ls -la

      - name: Package Windows (NSIS installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          # choco 只把 NSIS 目录写进机器 PATH（新 shell 才生效），当前 step 需手动加
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          wails3 task windows:package
          V="${GITHUB_REF_NAME#v}"
          # NSIS OutFile = unbox-<arch>-installer.exe（ARG_FLAG → AMD64/ARM64），
          # 便携 exe = bin/unbox.exe（build:native 输出不带架构后缀，每矩阵条目
          # 独立 runner 无冲突）。
          mv bin/*-installer.exe "UnBox-${V}-windows-${ARCH}-installer.exe"
          mv bin/unbox.exe       "UnBox-${V}-windows-${ARCH}.exe"
          ls -la

      - name: Package macOS (universal .app → zip)
        if: runner.os == 'macOS'
        run: |
          # darwin:package:universal 先按 amd64/arm64 各编一次，再用 lipo 合成
          # 通用二进制（Apple Silicon 与 Intel 通吃），无需 Intel runner。
          wails3 task darwin:package:universal
          V="${GITHUB_REF_NAME#v}"
          (cd bin && zip -qr "../UnBox-${V}-macos-universal.zip" unbox.app)
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: UnBox-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
