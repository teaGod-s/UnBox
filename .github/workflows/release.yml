# UnBox 分平台出包，每平台覆盖 amd64 + arm64（macOS 为 universal）。
#
# Wails v3 桌面应用依赖平台原生工具链（Linux 的 GTK/WebKit、macOS 的
# WKWebView、Windows 的 WebView2 + syso），所以放弃 goreleaser，改用
# 「每个平台各自的 runner 原生编译 amd64，arm64 在同 runner 上交叉编译」：
# Windows 走纯 Go（CGO=0）交叉编译 GOARCH=arm64；Linux arm64 借 wails-cross
# Docker 镜像（Zig cgo 交叉编译）；macOS 用 lipo 合成 arm64+amd64 通用二进制。
#
# 触发方式：
#   - 推送 v* 标签（如 v0.1.0）→ 构建并自动创建 GitHub Release 挂载产物
#   - 手动 workflow_dispatch → 仅构建并上传产物（不建 Release）
#
# 产物：
#   - Linux   UnBox-<ver>-linux-amd64.deb / .AppImage
#             UnBox-<ver>-linux-arm64.deb
#   - Windows UnBox-<ver>-windows-amd64/arm64-installer.exe / -amd64.exe / -arm64.exe
#   - macOS   UnBox-<ver>-macos-universal.zip（内含 .app，arm64 + amd64 通用二进制）

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
            arch: amd64
          - os: ubuntu-24.04
            name: linux-arm64
            arch: arm64
          - os: windows-latest
            name: windows-amd64
            arch: amd64
          - os: windows-latest
            name: windows-arm64
            arch: arm64
          - os: macos-latest
            name: macos-universal
            # 不设 arch：universal 内部按 task var 各编 amd64/arm64 再 lipo
    runs-on: ${{ matrix.os }}
    # ARCH 驱动 stock Taskfile 里所有 {{.ARCH | default ARCH}}（syso 架构、
    # build:native 的 GOARCH、NSIS ARG_FLAG）；GOARCH 供 generate:deb 的
    # nfpm.yaml `arch: ${GOARCH}` 读取（该步骤在宿主跑，不在 Docker 内）。
    env:
      ARCH: ${{ matrix.arch }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.9

      - name: Set version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.1" >> "$GITHUB_ENV"
          fi

      # Linux arm64 在 amd64 runner 上交叉编译，需 wails-cross Docker 镜像
      # （含 Zig 做 cgo 交叉编译）；amd64 原生编译，无需 Docker。
      - name: Setup Docker cross-compile image
        if: matrix.name == 'linux-arm64'
        run: wails3 task setup:docker

      - name: Package Linux (deb + AppImage)
        if: runner.os == 'Linux' && matrix.arch == 'amd64'
        run: |
          wails3 task linux:create:deb
          wails3 task linux:create:appimage
          V="${GITHUB_REF_NAME#v}"
          mv bin/*.deb       "UnBox-${V}-linux-amd64.deb"
          mv bin/*.AppImage  "UnBox-${V}-linux-amd64.AppImage"
          ls -la

      - name: Package Linux arm64 (deb only)
        if: runner.os == 'Linux' && matrix.arch == 'arm64'
        run: |
          wails3 task linux:create:deb
          V="${GITHUB_REF_NAME#v}"
          mv bin/*.deb "UnBox-${V}-linux-arm64.deb"
          ls -la

      - name: Package Windows (NSIS installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          # choco 只把 NSIS 目录写进机器 PATH（新 shell 才生效），当前 step 需手动加
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          wails3 task windows:package
          V="${GITHUB_REF_NAME#v}"
          # NSIS OutFile = unbox-<arch>-installer.exe（ARG_FLAG → AMD64/ARM64），
          # 便携 exe = bin/unbox.exe（build:native 输出不带架构后缀，每矩阵条目
          # 独立 runner 无冲突）。
          mv bin/*-installer.exe "UnBox-${V}-windows-${ARCH}-installer.exe"
          mv bin/unbox.exe       "UnBox-${V}-windows-${ARCH}.exe"
          ls -la

      - name: Package macOS (universal .app → zip)
        if: runner.os == 'macOS'
        run: |
          # darwin:package:universal 先按 amd64/arm64 各编一次，再用 lipo 合成
          # 通用二进制（Apple Silicon 与 Intel 通吃），无需 Intel runner。
          wails3 task darwin:package:universal
          V="${GITHUB_REF_NAME#v}"
          (cd bin && zip -qr "../UnBox-${V}-macos-universal.zip" unbox.app)
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: UnBox-*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
